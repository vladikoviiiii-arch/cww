<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CWW console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f7;--fg:#1c2033;--muted:#5d6482;--panel:#fff;--line:#c9cde0;--accent:#5b4bdb;
--tbg:#1b1f36;--tfg:#e4e7ff;--tdim:#8b91b8;--tpink:#ff93a8;--terr:#ff7a7a;--tok:#9be3b5;
--mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141f;--fg:#e6e8f5;--muted:#9aa0c0;--panel:#1a1d2d;--line:#2d3250;--accent:#9d92ff;--tbg:#0c0e18}}
:root[data-theme="dark"]{--bg:#12141f;--fg:#e6e8f5;--muted:#9aa0c0;--panel:#1a1d2d;--line:#2d3250;--accent:#9d92ff;--tbg:#0c0e18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);line-height:1.5}
main{max-width:860px;margin:0 auto;padding:28px 18px 40px}
.logo{height:56px;width:auto;max-width:100%;display:block}
h1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.name{color:var(--fg)}
h1{font-size:2rem;margin:0 0 4px;font-weight:500;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{margin:0 0 20px;color:var(--muted);font-size:.9rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button{font:inherit;font-size:.85rem;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,.drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px 16px;text-align:center;color:var(--muted);background:var(--panel);cursor:pointer;margin-bottom:14px}
.drop.over{border-color:var(--accent);color:var(--fg);background:var(--bg)}
.drop b{color:var(--fg);font-weight:500}
.term{background:var(--tbg);color:var(--tfg);border-radius:10px;padding:14px 16px;min-height:300px;max-height:60vh;overflow:auto;font-size:.95rem}
.ln{white-space:pre-wrap;word-break:break-word;min-height:1.5em}
.cmd{color:var(--tpink)}.dim{color:var(--tdim)}.err{color:var(--terr)}.ok{color:var(--tok)}.you{color:var(--tpink)}
.row{display:flex;gap:8px;align-items:center}
.row span{color:var(--tpink)}
.row input{flex:1;min-width:0;font:inherit;background:transparent;color:var(--tfg);border:0;border-bottom:1px solid var(--tdim);padding:2px 0}
.note{color:var(--muted);font-size:.8rem;margin-top:12px}
</style>
</head>
<body>
<main>
<h1><img src="cwwrunplacelogo.png" alt="" class="logo"><span class="name">cww runplace</span></h1>
<p class="sub">Drop a .cww file here and it runs it.</p>
<div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose or drop a .cww file">
<b>Drop a .cww file here</b><br>or click to choose one
<input type="file" id="file" accept=".cww" hidden>
</div>
<div class="bar">
<button id="again" disabled>Run again</button>
<button id="example">Try an example</button>
<button id="clear">Clear</button>
</div>
<div class="term" id="out" aria-live="polite"><div class="ln dim">Waiting for a file…</div></div>
<p class="note">Supports type, ask, wait, “” comments, optional closing, math, variables, and {x] inserts with the (dont) escape.</p>
</main>
<script>
(function(){
var out=document.getElementById('out'),drop=document.getElementById('drop'),fileIn=document.getElementById('file'),
againBtn=document.getElementById('again'),runId=0,last=null;
var EXAMPLE='name = ask("Username?")\nwait(.5) ""or you can do this wait(0.5)\ntype("processing...\nwait(3\ntype("Welcome, {name]!")\ntype("escaped: (dont){name]")\ntype(2+(3*4))\n';

function print(t,c){var d=document.createElement('div');d.className='ln '+(c||'');d.textContent=t;out.appendChild(d);out.scrollTop=out.scrollHeight;return d}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function askUser(q,id){
  return new Promise(function(res,rej){
    print(q);
    var row=document.createElement('div');row.className='ln row';
    var p=document.createElement('span');p.textContent='>';
    var inp=document.createElement('input');inp.type='text';inp.setAttribute('aria-label','Your answer');
    row.appendChild(p);row.appendChild(inp);out.appendChild(row);inp.focus();out.scrollTop=out.scrollHeight;
    inp.addEventListener('keydown',function(e){
      if(e.key!=='Enter')return;
      if(id!==runId){rej('stop');return}
      row.remove();print('> '+inp.value,'you');res(inp.value);
    });
    row._abort=function(){rej('stop')};
  });
}
function count(s,ch){return s.split(ch).length-1}
function stripComment(l){
  var i=0;
  while((i=l.indexOf('""',i))!==-1){
    if(i>0&&l[i-1]==='('){i+=2;continue} /* empty string like ask("") */
    return l.slice(0,i);
  }
  return l;
}
function parseText(rest){
  var s=rest.trim();
  if(s[0]!=='"')return null;
  s=s.slice(1);
  if(s.slice(-2)==='")')s=s.slice(0,-2);
  else if(s.slice(-1)==='"')s=s.slice(0,-1);
  else if(s.slice(-1)===')'&&count(s,')')>count(s,'('))s=s.slice(0,-1);
  return s;
}
function parseBare(rest){
  var s=rest.trim();
  while(s.slice(-1)===')'&&count(s,')')>count(s,'('))s=s.slice(0,-1);
  return s.trim();
}
function insert(t,vars){
  return t.replace(/(\(dont\))?\{(\w+)\]/g,function(m,esc,n){
    if(esc)return '{'+n+']';
    return Object.prototype.hasOwnProperty.call(vars,n)?vars[n]:m;
  });
}
function bareValue(b,vars){
  if(b==='')throw 'nothing inside the brackets';
  if(/^[A-Za-z_]\w*$/.test(b)){
    if(Object.prototype.hasOwnProperty.call(vars,b))return vars[b];
    throw 'no variable named '+b;
  }
  if(/^[\d+\-*\/%.() ]+$/.test(b)){
    if(count(b,'(')!==count(b,')'))throw 'math must be closed properly';
    var v;try{v=Function('return ('+b+')')()}catch(e){throw 'could not work out that math'}
    if(typeof v!=='number'||!isFinite(v))throw 'could not work out that math';
    return String(v);
  }
  throw 'text needs quotes, variables do not';
}
async function run(src,name){
  var id=++runId,vars={},lines=src.split(/\r?\n/),m;
  out.innerHTML='';last={src:src,name:name};againBtn.disabled=false;
  print('$ run '+name,'cmd');print('');
  try{
    for(var n=0;n<lines.length;n++){
      var l=stripComment(lines[n]).trim();
      if(!l)continue;
      try{
        if((m=l.match(/^([A-Za-z_]\w*)\s*=\s*ask\((.*)$/))){
          var q=parseText(m[2]);if(q===null)throw 'ask needs a question in quotes';
          vars[m[1]]=await askUser(insert(q,vars),id);
        }else if((m=l.match(/^type\((.*)$/))){
          var t=parseText(m[1]);
          print(t!==null?insert(t,vars):bareValue(parseBare(m[1]),vars));
        }else if((m=l.match(/^wait\((.*)$/))){
          var b=parseBare(m[1]),s=/^[A-Za-z_]\w*$/.test(b)&&vars[b]!==undefined?vars[b]:b,sec=parseFloat(s);
          if(isNaN(sec)||sec<0)throw 'wait needs a number of seconds';
          print('[pause '+sec+'s]','dim');await sleep(sec*1000);
        }else throw 'I do not know that command';
      }catch(e){
        if(e==='stop')return;
        if(id!==runId)return;
        print('line '+(n+1)+': '+e,'err');
      }
      if(id!==runId)return;
    }
    print('');print('[program finished]','ok');
  }catch(e){}
}
function loadFile(f){
  if(!f)return;
  if(!/\.cww$/i.test(f.name)){out.innerHTML='';print('Only .cww files work here. “'+f.name+'” was skipped.','err');return}
  f.text().then(function(t){run(t,f.name)});
}
drop.addEventListener('click',function(){fileIn.click()});
drop.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();fileIn.click()}});
fileIn.addEventListener('change',function(){loadFile(fileIn.files[0]);fileIn.value=''});
['dragenter','dragover'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('over')})});
['dragleave','drop'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('over')})});
document.addEventListener('drop',function(e){loadFile(e.dataTransfer&&e.dataTransfer.files[0])});
againBtn.addEventListener('click',function(){if(last)run(last.src,last.name)});
document.getElementById('example').addEventListener('click',function(){run(EXAMPLE,'example.cww')});
document.getElementById('clear').addEventListener('click',function(){runId++;last=null;againBtn.disabled=true;out.innerHTML='';print('Waiting for a file…','dim')});
})();
</script>
</body>
</html>
